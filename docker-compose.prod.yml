name: pickus

services:
  db:
    image: timescale/timescaledb-ha:pg17
    restart: always
    container_name: postgres_db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - db_data:/home/postgres/pgdata/data
    networks:
      - pickus_network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_PORT: ${PGADMIN_PORT}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_SCRIPT_NAME: "'/pgadmin'"
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./config/servers.json:/pgadmin4/servers.json
    depends_on:
      - db
    ports:
      - '${PGADMIN_PORT}:80'
    networks:
      - pickus_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: pickus_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      FRONTEND_BASE_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 3000:3000
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - pickus_network

  frontend:
    build: ./frontend
    container_name: pickus_frontend
    restart: unless-stopped
    ports:
      - '8081:8081'
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pickus_network

  gateway:
    build:
      context: gateway
      dockerfile: Dockerfile
    container_name: pickus_gateway
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
      - frontend
    networks:
      - pickus_network

networks:
  pickus_network:
    driver: bridge

volumes:
  db_data:
  pgadmin_data:
