name: Build APK

on:
  push:
    branches:
      - fix/apk # CHANGE TO dev
      - main

defaults:
  run:
    working-directory: ./frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Get build info
        id: info
        run: |
          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "branch=$(echo ${{ github.ref_name }} | tr '/' '-')" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT

      - name: Debug env vars
        run: |
          echo "=== EXPO PUBLIC VARS ==="
          env | grep EXPO_PUBLIC_ || echo "None found"
          echo "=== NODE ENV ==="
          echo "NODE_ENV=$NODE_ENV"

      - name: Install dependencies
        run: npm install && npm install lightningcss-linux-x64-gnu --no-save

      - name: Prebuild (generate android/ folder)
        run: npx expo prebuild --platform android

      - name: Build APK
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug -PbundleInDebug=true --stacktrace

      - name: List APK output
        run: find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Publish Dev APK
        if: github.ref == 'refs/heads/fix/apk' # CHANGE TO dev
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.branch }}-${{ steps.info.outputs.date }}-${{ steps.info.outputs.short }}
          name: '${{ steps.info.outputs.branch }} ${{ steps.info.outputs.date }} (${{ steps.info.outputs.short }})'
          prerelease: true
          files: frontend/android/app/build/outputs/apk/debug/*.apk

      - name: Publish Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.branch }}-${{ steps.info.outputs.date }}-${{ steps.info.outputs.short }}
          name: '${{ steps.info.outputs.branch }} ${{ steps.info.outputs.date }} (${{ steps.info.outputs.short }})'
          prerelease: false
          files: frontend/android/app/build/outputs/apk/debug/*.apk
