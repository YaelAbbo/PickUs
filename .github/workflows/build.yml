name: Build APK

on:
  push:
    branches:
      - feat/eas-apk-build # CHANGE TO dev
      - main

defaults:
  run:
    working-directory: ./frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prebuild (generate android/ folder)
        run: npx expo prebuild --platform android --clean

      - name: Build Debug APK (dev branch)
        if: github.ref == 'refs/heads/feat/eas-apk-build' # CHANGE TO dev
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug -PbundleInDebug=true

      - name: Build Release APK (main branch)
        if: github.ref == 'refs/heads/main'
        working-directory: ./frontend/android
        run: ./gradlew assembleRelease

      - name: Publish Debug Release
        if: github.ref == 'refs/heads/feat/eas-apk-build' # CHANGE TO dev
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.sha }}
          name: 'Dev build ${{ github.sha }}'
          prerelease: true
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ github.sha }}
          name: 'Release ${{ github.sha }}'
          prerelease: false
          files: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
