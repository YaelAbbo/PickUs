name: Backend Unit Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Spin up the PostgreSQL service container
    services:
      postgres:
        image: postgres:15-alpine # Lightweight postgres image
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pickus
        # Expose port 5432 to the GitHub Actions runner
        ports:
          - 5432:5432
        # Ensure the database is ready before the job continues
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 2. Inject Environment Variables for the NestJS application
    env:
      NODE_ENV: test
      # Connect to the service container mapped to the runner's localhost
      DB_HOST: localhost 
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pickus
      # Provide required variables so the app does not crash on startup
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      # Lowering bcrypt salt rounds heavily speeds up tests involving auth
      BCRYPT_SALT_ROUNDS: 1 
      REFRESH_TOKEN_COOKIE_KEY: refreshToken
      DB_LOGGING: false

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Optional: If your tests require the database schema to be created via migrations 
      # before running, uncomment this line based on your package.json scripts:
      # - name: Run Database Migrations
      #   run: npm run migration:run

      - name: Run Jest tests
        run: npm run test
