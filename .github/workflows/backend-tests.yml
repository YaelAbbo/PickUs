name: Backend Unit Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Spin up the necessary Service Containers
    services:
      postgres:
        # Using pgvector image to support your AddVectorEmbeddings migration
        image: pgvector/pgvector:pg15 
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pickus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        # Added Redis since your .env references it
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 2. Inject ALL Environment Variables for the NestJS application
    env:
      NODE_ENV: test
      APP_NAME: PickUs
      BACKEND_PORT: 3000
      BASE_URL: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost
      FRONTEND_URL: http://localhost:8081
      
      # JWT / Auth
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      BCRYPT_SALT_ROUNDS: 1 # Keep at 1 to make tests fast
      REFRESH_TOKEN_COOKIE_KEY: refreshToken
      
      # Database Connections (Must be localhost in GitHub Actions)
      DB_HOST: localhost 
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pickus
      DB_LOGGING: false
      
      # Redis (Must be localhost in GitHub Actions)
      REDIS_HOST: localhost
      REDIS_PORT: 6379

      # Mailer 
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: false
      SMTP_USER: pickus.app@gmail.com
      SMTP_PASS: test-password
      SMTP_FROM: pickus.app@gmail.com
      
      # APIs
      GEMINI_API_KEY: test-key-do-not-use-real-key-in-ci

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm run test
