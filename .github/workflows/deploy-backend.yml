name: Build & Deploy (Backend + Gateway)

on:
  push:
    branches:
      # - dev
      - "**" # For testing purposes, deploy on pushes to any branch. Change to specific branches in production.

jobs:
  # ─── Job 1: Build images and push to GHCR ───────────────────────────────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "sha_tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/yaelabbo/pickus/backend:latest
            ghcr.io/yaelabbo/pickus/backend:${{ steps.meta.outputs.sha_tag }}

      # ── Gateway ──────────────────────────────────────────────────────────────
      - name: Build & push gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/yaelabbo/pickus/gateway:latest
            ghcr.io/yaelabbo/pickus/gateway:${{ steps.meta.outputs.sha_tag }}

  # ─── Job 2: Deploy on the remote VM ─────────────────────────────────────────
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/cs103/PickUs

            # Pull latest code (docker-compose.prod.yml changes etc.)
            git pull origin dev

            # Authenticate with GHCR so we can pull private images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the newly built images
            docker compose -f docker-compose.prod.yml pull backend gateway

            # Restart only backend and gateway — db and pgadmin are untouched
            docker compose -f docker-compose.prod.yml up -d --no-deps backend gateway

            # Clean up dangling images to save disk space
            docker image prune -f
